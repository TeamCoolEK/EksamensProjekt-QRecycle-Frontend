# Redirect HTTP to HTTPS (both www and non-www)
server {
    listen 80;
    server_name teamcool.swag.dk www.teamcool.swag.dk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://teamcool.swag.dk$request_uri;
    }
}

# Redirect www HTTPS → non-www HTTPS
server {
    listen 443 ssl;
    server_name www.teamcool.swag.dk;

    ssl_certificate /etc/letsencrypt/live/teamcool.swag.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamcool.swag.dk/privkey.pem;

    return 301 https://teamcool.swag.dk$request_uri;
}

# Main server — non-www only
server {
    listen 443 ssl;
    server_name teamcool.swag.dk;

    ssl_certificate /etc/letsencrypt/live/teamcool.swag.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamcool.swag.dk/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}