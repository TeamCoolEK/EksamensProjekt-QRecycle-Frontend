server {
    listen 80;
    server_name teamcool.swag.dk www.teamcool.swag.dk;

    #Required for certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    #Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name teamcool.swag.dk www.teamcool.swag.dk;

    ssl_certificate /etc/letsencrypt/live/teamcool.swag.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamcool.swag.dk/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API requests to the Spring Boot backend
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}